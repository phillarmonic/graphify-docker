name: "Build and push Docker Image"

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      graphify_version:
        description: "graphifyy version to install (defaults to latest)"
        default: ""
        required: false

jobs:
  build_graphify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version information
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            # Remove 'v' prefix if it exists
            VERSION=${VERSION#v}
            MAJOR_VERSION=$(echo $VERSION | cut -d. -f1)
          else
            VERSION="edge"
            MAJOR_VERSION="edge"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major_version=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GRAPHIFY_VERSION=${{ github.event.inputs.graphify_version }}
          tags: |
            phillarmonic/graphify-docker:latest
            phillarmonic/graphify-docker:${{ steps.version.outputs.major_version }}
            phillarmonic/graphify-docker:${{ steps.version.outputs.version }}
